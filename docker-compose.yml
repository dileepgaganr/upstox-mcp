services:
  upstox-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upstox
    env_file:
      - .env
    ports:
      - "9082:9082"
    restart: unless-stopped
    stdin_open: true
    tty: true
    init: true       # Reaps orphaned children from docker exec MCP sessions
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
